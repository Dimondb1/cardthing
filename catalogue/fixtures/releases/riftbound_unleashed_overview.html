<!DOCTYPE html><html lang="en-us"><head><meta charSet="utf-8"/><title>The Unleashed Overview</title></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"page":{"title":"The Unleashed Overview","displayedPublishDate":"2026-03-16T16:00:00.000Z","blades":[{"type":"articleRichText","richText":{"body":"<p>The Jungle is a living force. It sees you before you see it. It rewards patience, punishes arrogance, and belongs to those who know how to move through it without being seen. At the heart of Riftbound’s third set is a single unifying idea:</p><h3 style=\"text-align: center;\"><strong>“Power strikes from the shadows.”</strong></h3><p>Champions like <strong>Master Yi, Diana, Vi</strong>, and <strong>Pyke</strong> embody this idea of hidden strength and patient transformation. Each has walked a solitary path, shaped not in the spotlight, but in silence. Whether it’s Yi’s clarity through focus, Diana’s exile-forged conviction, Vi’s relentless pursuit of justice, or Pyke’s calculated retribution, all four share a common truth: their power was earned in the dark. They represent the Jungle’s rhythm: <strong>wait, watch, strike</strong>, and prove that real strength doesn’t roar. It <strong>lurks</strong>, <strong>builds</strong>, and <strong>erupts</strong> when the moment is right.</p><p>In short, Unleashed is about <strong><em>becoming</em></strong>.</p><p>Champions don’t arrive fully formed, they grow, evolve, and strike only when it matters.</p><p>The Jungle is their crucible, and Unleashed introduces the new XP mechanic to illustrate that change, enabling fantastic new abilities. Every XP token, every monster defeated, every hidden advantage gained… is a step toward dominance.</p><h2><strong>Unleashed Dev Video</strong></h2><p>To kick off your Unleashed experience, check out our Dev Video to get hyped for what this set has in store.</p>"}},{"type":"articleRichText","richText":{"body":"<h2><strong>New Mechanics</strong></h2><h2>XP</h2><p>XP is a resource you build up and spend for unique advantages.&nbsp;</p><p>Let’s look at Kha’Zix, Voidreaver. This Champion Legend is a great example of ways you can gain and spend XP for interesting effects.</p><p><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/a4f505e786084be2c5ab01b1e9ad2ebc84700edc-744x1039.jpg\" alt=\"\"></p><p>His card reads “When you win a combat, gain 1 XP.” Once you have gained XP, you can use the abilities on this card to spend 1 XP to Buff a unit, or 2 XP to move an exhausted friendly unit from a battlefield to its base.</p><p>For each XP you accrue, you also gain a level, and many of your cards will gain new abilities as you gain levels. Here’s how it works: Cards with Level benefit from how much XP you've earned. Those cards gain unique benefits once you've reached their XP level.&nbsp;</p><p><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/c30d273e5bc8187ef9e3049dc53e2781da3fcb8b-744x1039.jpg\" alt=\"\"></p><p>Here’s an example, using Master Yi, Unstoppable. When you have 3 XP, that means Master Yi, Unstoppable is Level 3, and he costs 2 less Energy and 1 less Power to play. At Level 6 and 11 he costs even less, and if you get him to Level 16 he can't be chosen by enemy spells and abilities.&nbsp;</p><h2>Hunt</h2><p>Hunt is a new mechanic that helps you build up the XP you’ll use to enhance your cards or spend for splashy effects. When a unit with Hunt conquers or holds a battlefield, you gain the amount of XP on the card.</p><p><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/3555c336584ef83f2a1c1eaebb5c86fbef398100-744x1039.jpg\" alt=\"\"></p><p>As you can see, this Mosstompter has the Hunt effect, which reads ”When I conquer or hold, gain 2 XP.” It also has a Level 3 ability, so it benefits from gaining XP too.&nbsp;&nbsp;</p><h2>Ambush</h2><p>In League of Legends, one of the core skills of a jungler is the ability to attack from concealment at just the right moment. In Riftbound, the new Ambush mechanic lets you do that too. Specifically, Ambush lets you play a unit as a Reaction to a battlefield where you have units.</p><p>Take a look at Inferna:</p><p><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/61498ba2142d1ee4535c515848a0f89a4b8dcf12-744x1039.jpg\" alt=\"\"></p><p>Since she’s also got Assault 2, Inferna is sure to make a splash when she lands at a contested battlefield.&nbsp;</p><h2><strong>Unleashed Tokens:</strong></h2><p>We hope you’re hungry for new tokens, because Unleashed is jam-packed with them. Have a look!&nbsp;</p><h3>Baron Pit:&nbsp;</h3><p>This token joins the battlefield when Baron Nashor is played</p><p><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/7b93ba6db074d87275126c2e4b0029dbb063fc0e-744x1039.jpg\" alt=\"\"></p><p>&nbsp;</p><p><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/5637bf6e0007030673114c1126b7908de966bec8-744x1039.jpg\" alt=\"\"></p><h3>Bird:&nbsp;</h3><p>This elusive new token is armed with Deflect.</p><p><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/4d485f46dae1424c380ea4e135897720f2682f77-744x1039.jpg\" alt=\"\"></p><h3>Brush:&nbsp;</h3><p>When you play Ivern, Green Father, you can replace battlefields with this Brush token.</p><p><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/066ede65571d036a4619418e9937355b5f6a4f52-744x1039.jpg\" alt=\"\"></p><h3>Buff:&nbsp;</h3><p>An old standby, this gives a unit +1 Might.</p><p><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/b5297479bfe9a9c5976a22a7c4b0ded32325ee58-744x1039.jpg\" alt=\"\"></p><h3>Gold:&nbsp;</h3><p>Debuting in Spiritforged, Gold gives you one Power when you exhaust and kill it.</p><p><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/382800acddb718c47765b74b3857167091013037-744x1039.jpg\" alt=\"\"></p><h3>Reflection:&nbsp;</h3><p>A new token, this one becomes a copy of another card already in play.</p><p><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/516701826dcb03dd457216fb861b6ecbca5a9a72-744x1039.jpg\" alt=\"\"></p><h3>Sprite:&nbsp;</h3><p>This token is temporary, meaning you kill it at the start of your Beginning phase.</p><p><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/b6aa21b99333c8e6eb68b17072e2ae72620400ab-744x1039.jpg\" alt=\"\"></p><h3>XP Tracker:&nbsp;</h3><p>With Unleashed comes XP, and you’re definitely gonna want to know how much XP you have. This tracker helps with that.</p><p><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/c5b6ae111dc260a926d790deb1bf244fbbc92da2-744x1039.jpg\" alt=\"\"></p><h2><strong><u>Unleashed Product Line</u></strong></h2><h3>Booster Display Art</h3><p>With Unleashed, we have some exciting new things to show you, starting with the box art you’ll be seeing on store shelves. Who epitomizes a league teamfight gank more than Vi, Rengar, Master Yi and LeBlanc?&nbsp;</p><p><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/015f4d55fe1fb431976ec83ec76881d8076f6ebe-2000x2000.jpg\" alt=\"\"></p><h3>Preconstructed Decks:</h3><p>Curious about our Preconstructed Decks? Check back later in previews for decklists once the cards have been revealed!&nbsp;</p><h3>New Product: The Vault!&nbsp;</h3><p>Like any wily jungler, we still have some new tricks up our sleeves. In this case, we’re adding a new product to Riftbound: The Vault.</p><p>Arriving in a reusable card-storage box, inside you’ll find 6 Booster Packs from Riftbound Set 3: Unleashed, 36 basic runes (6 of each) to power your decks, 3 double-sided full art tokens, and 2 dividers to help keep your new cards organized. And this isn’t an Unleashed exclusive, you can look forward to a new Vault with future sets as well.</p><p><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/3265824752e5cd29880fd117760916fff9ded80f-2600x2600.jpg\" alt=\"\"></p><h2><strong><u>Unleashed Release Dates</u></strong></h2><p>Wondering when everything is going down? Let us <i>unleash</i> some dates for you.</p><ul><li><strong>Preview Season:</strong> Previews begin today, Monday, 3/16 and end on Thursday, 3/26.</li><li><strong>Merch Store Drawing:</strong> There will be Merch Store drawing for Booster Displays and Precon Decks starting 9am Pacific on 4/13 and closing entries at 9am Pacific on 4/15.</li><li><strong>Pre-Rift:</strong> For the Chinese language release, the Pre-Rift begins on 4/3, and for the English language release the Pre-Rift begins on 5/1.</li><li><strong>Release Dates:</strong> The Chinese language release will be on 4/10, and the English version will release on 5/8.</li><li><strong>Summoner Skirmish Windows: </strong>As with every set release, there are two periods in which Summoner Skirmishes may occur. For Unleashed, those are: Window 1 begins on 5/25 and Window 2 begins on 6/22.</li></ul><h2>Collectibility</h2><h3><strong><u>Ultimate Rarity:&nbsp;</u></strong></h3><p>Unleashed introduces the ‘Ultimate’ rarity to Riftbound, a rarity for individually exciting, very very... very hard to find cards. And Riftbound’s first Ultimate Rare is a unique overnumbered card of the new Baron Nashor!</p><p>The Ultimate Rarity Baron Nashor was revealed as part of the coverage of the China Major tournament on March 21-22, 2026. The image here doesn’t do it justice.</p><p><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/5037651d669fec78045cf8fc510e1a8d5bcac712-1920x1080.jpg\" alt=\"\"></p><p>This is the only Ultimate rare in Unleashed, and Ultimate Rares will not appear in every Riftbound set going forward; we're saving it for those truly special cards.</p><h3><strong><u>Booster Pack Rarity Distribution:&nbsp;</u></strong></h3><p>Each Riftbound: Unleashed booster pack contains:</p><ul><li>7 Common cards</li><li>3 Uncommon cards</li><li>1 Foil slot that can be a Common, Uncommon, Rare or Epic card</li><li>2 Rare, Epic, Alt, Overnumber, or Ultimate cards</li><li>1 Token, Rune, or Alt Rune slot</li><li>1 informational insert</li></ul><p>Note that packs can only ever have up to one Ultimate Rare card, they will appear in &lt; 0.1% of packs. Pack contents are randomized during manufacturing. Any stated appearance rates reflect averages across the print run and are not guarantees of appearance in booster packs or booster displays.</p><h2>Promos</h2><p>Now that the cards are revealed we can give the update of what promos players can expect at their LGS.</p><h3>Pre-Rift</h3><p>Sign up for your LGS’s Pre-Rift event and get your copy of Ashe, while supplies last!</p><p><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/2a8b70fb77a4a0011cba4d53110b1532b9f3cd5e-744x1039.jpg\"></p><h3>Nexus Nights</h3><p>The Nexus Night promo packs are being updated with new cards from Unleashed, and we’re carrying over the alternate art runes from Spiritforged (available while supplies last for Nexus Nights).</p><p><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/f8d5389a418b342977d6f4789f2605c650405d5c-1920x1080.jpg\"></p><h3>Summoner Skirmish 1</h3><p>For those who participate in the first Summoner Skirmish window after Unleashed releases, you’ll be chasing the following promos (available while supplies last.)</p><figure class=\"table\" style=\"min-width:75px;\"><table style=\"\"><tbody><tr><td colspan=\"1\" rowspan=\"1\"><strong>Participation</strong></td><td colspan=\"1\" rowspan=\"1\"><strong>Top Cut</strong></td><td colspan=\"1\" rowspan=\"1\"><strong>Champion</strong></td></tr><tr><td colspan=\"1\" rowspan=\"1\"><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/2de27ba77ea00df7a1dbd7560ec083ad83ba9aea-744x1039.jpg\"></td><td colspan=\"1\" rowspan=\"1\"><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/2a37aed64ca9d45fddd1ba050697e19e514ab769-744x1039.jpg\"></td><td colspan=\"1\" rowspan=\"1\"><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/3801c6b9a99c6c22cfcabd652fa166562b86d240-744x1039.jpg\"></td></tr></tbody></table></figure><h3>Summoner Skirmish 2</h3><p>And for competing in the second Summoner Skirmish event after Unleashed’s launch, you’ll have your chance at these, while supplies last.</p><figure class=\"table\" style=\"min-width:75px;\"><table style=\"\"><tbody><tr><td colspan=\"1\" rowspan=\"1\"><strong>Participation</strong></td><td colspan=\"1\" rowspan=\"1\"><strong>Top Cut</strong></td><td colspan=\"1\" rowspan=\"1\"><strong>Champion</strong></td></tr><tr><td colspan=\"1\" rowspan=\"1\"><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/f0548abedb8396d12f6e21be564a839a8210be25-744x1039.jpg\"></td><td colspan=\"1\" rowspan=\"1\"><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/6fd2a8817f6de22c7d6501589d7d7d68b860d7e2-744x1039.jpg\"></td><td colspan=\"1\" rowspan=\"1\"><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/9660a700b5b46eb1f8a688e477828ca74b0f9b79-744x1039.jpg\"></td></tr></tbody></table></figure><h2>The End</h2><p>That’s all for now! We hope you enjoy all the exciting Unleashed card reveals in the coming days, and if you’re interested to be in the loop on all things Riftbound, be sure to sign up for our <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://newsletter.riotgames.com/riftbound-subscribe\"><u>newsletter</u></a>!</p>"}}]}}}}</script></body></html>
