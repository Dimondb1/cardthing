<!DOCTYPE html><html lang="en-us"><head><meta charSet="utf-8"/><title>The Vendetta Overview</title></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"page":{"title":"The Vendetta Overview","displayedPublishDate":"2026-07-07T01:00:00.000Z","blades":[{"type":"articleRichText","richText":{"body":"<p>Welcome to the Riftbound:&nbsp;Vendetta overview. Here you’ll find key dates, new mechanics, collectibility details, and product highlights as preview season rolls on.&nbsp;</p><p>Riftbound:&nbsp;Vendetta brings enemy-color-pair Legends, new mechanics, and a simultaneous English and Chinese release.</p><h1>Welcome to&nbsp;Vendetta</h1><p>Riftbound’s fourth set is all about rivalry. Clashes between former friends, immortal enemies, and members of the same family.</p><p>When you choose a legend in&nbsp;Vendetta, you’re stepping into a conflict that was here before you and will persist long after your game ends. And you’ll be all the stronger for having taken part in it.&nbsp;</p><p>Because rivalries challenge us and force us to grow. After all, there is no Shen without Zed. Or no Mel without Ambessa.&nbsp;</p><p>It’s the conflict that makes you&nbsp;legendary.&nbsp;</p><h2>Dev Video</h2><p>Check out our Dev Video for a snapshot of this set, and a look into the fierce rivalry between Dave and Chengran!</p>"}},{"type":"articleRichText","richText":{"body":"<p><meta></p><h2>Key Dates</h2><ul><li><strong>Previews</strong>: July 6-18</li><li><strong>Pre-Rift</strong>: July 24</li><li><strong>Release</strong>: July 31 for English and Chinese; Oct. 23 for French&nbsp;</li></ul><h2>New Set, New Mechanics</h2><h3>Flow</h3><p>Flow lets you play cards from your trash instead of from your hand. It was inspired by League Champs who use Energy, and captures the faster recovery and reuse of abilities that they display.</p><p><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/df059084d9acefa0dcc3e3170c4b3eef41ee1bcf-744x1039.png\" width=\"744\" height=\"1039\"></p><p><meta></p><h3>Burn&nbsp;</h3><p>Burn sends cards from a Main Deck to the Trash. Some cards burn your own deck to fuel synergies, while others attack your opponent’s deck directly.&nbsp;</p><p><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/7e92f8094784cdb55ec54398cf8a2314472be23a-744x1039.png\" width=\"744\" height=\"1039\"></p><p><meta></p><h3>Empower</h3><p>Cards with Empower on them have the potential to gain new abilities once they’re in play, often after paying a cost. This allows you to get a card on the board one turn, then amplify its might or effect on another turn.&nbsp;</p><p><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/3382a1b1cc738d7de0dddfece19c09ea40f92e59-744x1039.png\" width=\"744\" height=\"1039\"></p><p><meta></p><h2><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/ee86783cdde66c59e902a52dfa7b6f686d46cff6-744x1039.png\" width=\"744\" height=\"1039\"></h2><h2>New Types of Cards</h2><h3>New Unit Type: Unit-Gear</h3><p>A new unit emerges in&nbsp;<i>Vendetta</i>, Unit-Gear! Cards like this little guy count as, you guessed it, both units and gear!</p><p><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/19fd48ea157ecfcdcda18d0ecacf1dd5a0289b0d-744x1039.png\" width=\"744\" height=\"1039\"></p><p><meta></p><h3>Decrees</h3><p>While not a new type of spell, decrees are a cycle of spells that are designed with Domain rivalries in mind. Each Domain has a decree that strikes hard against cards of its opposite domain color.</p><p><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/39f0b9845b5e2cc8912089e987a57c151757d596-744x1039.png\" width=\"744\" height=\"1039\"></p><p><meta></p><h2><meta></h2><h3><meta></h3><h3>New Tokens</h3><h4>Tentacle</h4><p>A new token that helps Bilgewater decks build pressure on the board.&nbsp;</p><p><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/4eaf43866f4d25b0a4cc2f5eed88edef95fb73f9-744x1039.png\" width=\"744\" height=\"1039\"></p><h4>Shadow Clone</h4><p><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/1827779cd1db1f6987fd9281cffab33fe5fd5f57-744x1039.png\" width=\"744\" height=\"1039\"></p><h4>Empowered</h4><p>A marker token used to track cards that have been upgraded through Empower.</p><p><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/d8f215ab4333ecef02a472d817beada5f20d0e4f-744x1039.png\" width=\"744\" height=\"1039\"></p><h2>Collectibility</h2><h3>Booster Pack Rarity Distribution</h3><p>Each Riftbound:&nbsp;Vendetta&nbsp;booster pack contains:</p><ul><li>7 Common cards</li><li>3 Uncommon cards</li><li>1 Foil slot that can be a Common, Uncommon, Rare or Epic card</li><li>2 Rare, Epic, Alt, Special Alt, or Overnumber cards</li><li>1 Token, Rune, or Alt Rune slot</li><li>1 Informational insert</li></ul><p>Note: The Crystal Rose Special numbered cards are distributed more similarly to a base Alt Art card and should not be seen as an Overnumber.</p><p>Pack contents are randomized during manufacturing. Any stated appearance rates reflect averages across the print run and are not guarantees of appearance in booster packs or booster displays.</p><h2>Showcase Treatments</h2><h3>Crystal Rose Alt Arts</h3><p>The Crystal Rose Alt Arts celebrate&nbsp;<strong>Wild Rift</strong>’s returning skinline by bringing those fan-favorite looks into Riftbound.&nbsp;</p><p><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/692e7b0162803dab4c568e06add7e42f66a52b73-744x1039.png\" width=\"744\" height=\"1039\"></p><p><meta></p><p>The Crystal Rose Alt Arts will appear as often as other Alt Art cards in&nbsp;<i>Vendetta</i>&nbsp;booster packs. They have a “special” (literally) numbering because we are celebrating art from&nbsp;<strong>Wild Rift</strong>&nbsp;for these, and we reserve the Overnumber designation for art which is created by Riftbound.</p><h3>Overnumbers</h3><p>In&nbsp;Vendetta, we have the nine new Legends in the set represented with their Overnumbered variants, which can be found with an artist's signature as well.&nbsp;</p><h4>Rival Overnumbers</h4><p>In addition, we have 22 (!!!) champion overnumbers representing the legendary rivalries from the League universe. These pieces are diptychs, allowing you to collect and show off your favorite pairings of friends, family, rivals, and enemies (or all of the above!)</p><p style=\"text-align:center;\"><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/2dc7a9656856e9d55751e3a172d9b1150c6cb998-1848x1039.jpg\" width=\"1848\" height=\"1039\"></p><p><meta></p><h2>Vendetta Product Line-Up</h2><h3>Booster Display&nbsp;</h3><p>With&nbsp;<i>Vendetta</i>, some incredible new box art is sneaking onto shelves. Do you have the courage to grab one of these boxes featuring Akali, Ambessa and Mel?</p><p><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/9408af9a44e928cde55d1f95f791cf96147e607a-3600x2025.jpg\" width=\"3600\" height=\"2025\"></p><p><meta></p><h3>New Product: Showdown Decks!</h3><p>Shen or Zed: whose blade is deadliest? Showdown Decks give you two ready-to-play decks, making them an easy way to jump in with a friend, learn the matchup, or add new cards to your collection.&nbsp;</p><p>Check back later in previews for decklists once the cards have been revealed!</p><p>&nbsp;</p><p><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/630b95faeae67ea1fc3acb95e917762d5130f7da-3840x2160.jpg\" width=\"3840\" height=\"2160\"></p><p><meta></p><p><meta></p><h3>Shen Preconstructed Decklist</h3><div><figure class=\"table\"><table><tbody><tr><td style=\"width:50%;\"><p><strong>Legend</strong>:<br>Eye of Twilight</p><p><strong>Champion Options</strong>:<br>1 Shen, Leader of the Kinkou Order<br>2 Shen, Scourge of Shadows<br>1 Shen, Kinkou</p><p><strong>Main Deck</strong>:<br>1 Shadow Dash<br>1 Steel Paws<br>1 Kennen, Keeper of Balance<br>2 Sacred Protector<br>1 Resonating Strike<br>1 Ki Barrier<br>2 Discipline<br>2 Noxian Emissary<br>2 Pakaa Protector<br>1 Lacerate<br>3 Mournful Witness<br>3 Disciple of Shen<br>2 Hand Hammer<br>1 Twilight Shroud<br>2 Soulspinner<br>2 Keeper of Law<br>2 Field Musicians<br>2 Charm<br>2 Serene Ascetic<br>2 Loyal Poro<br>1 Dragon Form</p></td><td style=\"width:50%;\"><p><img style=\"width:75%;\" src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/e1a058a035f25155142be3e0c1661cd7fb4656b2-744x1039.jpg\" width=\"744\" height=\"1039\"></p><p><strong>Battlefields</strong>:</p><ul><li>Kinkou Temple</li><li>Grove of the God-Willow</li><li>Threshold of the Gray</li></ul><p><strong>Rune Pool</strong>:<br>6 Order Rune<br>6 Calm Rune<br><br><strong>Tokens</strong>:<br>5 Recruit // Empowered Tokens</p><p>&nbsp;</p></td></tr></tbody></table></figure></div><h3>Zed Preconstructed Decklist</h3><div><figure class=\"table\"><table><tbody><tr><td style=\"width:50%;\"><p><strong>Legend</strong>:<br>Master of Shadows</p><p><strong>Champion Options</strong>:<br>2 Zed, Without a Sound<br>1 Zed, From the Shadows</p><p><strong>Main Deck</strong>:<br>1 Mel, Defiant Soul<br>1 Morgana, Vindictive<br>1 Death Mark<br>1 Twilight Reveler<br>2 Twilight Step<br>2 Perfect Execution<br>1 Wind and Ghosts<br>2 Gust Monk<br>2 Shadow Fiend<br>3 Shadow Assassin<br>1 Ravenbloom Prefect<br>2 Traveling Merchant<br>3 Shadow Order Disciple<br>3 Punching Poro<br>3 Ruthless Strike<br>3 Shadowcloaked Assassin<br>3 Blade Twirler<br>3 Kinkou Lifeblade</p></td><td style=\"width:50%;\"><p><img style=\"width:75%;\" src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/cec37e712298fa7fa5ee85754232dd91a074f870-744x1039.jpg\" width=\"744\" height=\"1039\"></p><p><strong>Battlefields</strong>:</p><ul><li>Zaun Warrens</li><li>Shadow Temple</li><li>Threshold of the Gray</li></ul><p><strong>Rune Pool</strong>:<br>6 Chaos Rune<br>6 Fury Rune<br><br><strong>Tokens</strong>:<br>4 Shadow Clone // Empowered Tokens</p><p>&nbsp;</p></td></tr></tbody></table></figure></div><h3>Vault</h3><p>The Vault returns, bringing players a storage box, six&nbsp;<i>Vendetta</i>&nbsp;boosters, and Runes.</p><p><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/7e962a3eb09c2fcf5a81682d526644c12bcf9800-3840x2160.jpg\" width=\"3840\" height=\"2160\"></p><p><meta></p><h3>Pre-Rift Kits</h3><p>Repeating how they were utilized for previous Pre-Rifts, these boxes contain five&nbsp;<i>Vendetta</i>&nbsp;boosters and a seeded Pre-Rift pack for each of the new Legends in Vendetta.</p><p><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/c4e6ae4434f798614000e1284801508067fbe41f-5000x3840.png\" width=\"5000\" height=\"3840\"></p><p><meta></p><h3>Promos</h3><p>Now that the cards are revealed we can give the update of what promos players can expect at their LGS.</p><h3>Pre-Rift</h3><p>Sign up for your LGS’s Pre-Rift event and get your copy of Riven, Shattered, while supplies last!</p><p><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/4e506b5a2a12df743aa72be0bbaef8779dcc8513-744x1039.png\" width=\"744\" height=\"1039\"></p><p><meta></p><p><meta></p><h3>Nexus Nights</h3><p>The Nexus Night promo packs are being updated with new cards from&nbsp;Vendetta…</p><ul><li>Blade Twirler</li><li>Dune Surfer</li><li>Shadow Assassin</li><li>Field Musicians</li><li>Ol’ Poro</li><li>Tomb-Raider Barbara</li><li>Cloud Drake</li><li>Grumpy Rockbear</li><li>Patched Porobot</li><li>Fretful Feline</li><li>Repair Specialist</li><li>Profiteer</li><li>Spiderling</li><li>Tornado Warrior</li><li>Gust Monk</li><li>Horns of the Dragon</li><li>Soulspinner</li><li>Hungry Wolf</li><li>Mel, Newly Awakened</li><li>Alternate Runes</li></ul><p><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/3b9e86422d0856c5629abbc7c2286f62e245f020-1848x1039.jpg\" width=\"1848\" height=\"1039\"></p><p><img src=\"https://cmsassets.rgpub.io/sanity/images/dsfx7636/news_live/175b5d32ed9d011639985afeb49b02a24bc5b561-1200x1096.jpg\" width=\"1200\" height=\"1096\"></p><p><meta></p><h3>Summoner Skirmish 1</h3><p>For those who participate in the first Summoner Skirmish window after&nbsp;Vendetta&nbsp;releases, you’ll be chasing the following promos (available while supplies last.)</p><p>Events will begin running Aug 17</p><div><figure class=\"table\"><table><tbody><tr><td><strong>Participation</strong></td><td><strong>Top Cut</strong></td><td><strong>Champion</strong></td></tr><tr><td>Morgana, Vindictive</td><td>Illaoi, Prophet of the Great Kraken</td><td>Illaoi, Prophet of the Great Kraken</td></tr></tbody></table></figure></div><h3>Summoner Skirmish 2</h3><p>And for competing in the second Summoner Skirmish event after Vendetta’s release, you’ll have your chance at these, while supplies last.</p><p>Events will begin running Sep 14th</p><div><figure class=\"table\"><table><tbody><tr><td><strong>Participation</strong></td><td><strong>Top Cut</strong></td><td><strong>Champion</strong></td></tr><tr><td>Swain, Visionary</td><td>Kayle, Justified</td><td>Kayle, Justified</td></tr></tbody></table></figure></div><h2>The End</h2><p>That’s all for now! We hope you enjoy the&nbsp;<i>Vendetta</i> card reveals in the days ahead. If you want to stay in the loop on all things Riftbound, sign up for our&nbsp;<a target=\"_blank\" rel=\"noopener noreferrer\" href=\"https://newsletter.riotgames.com/riftbound-subscribe\">newsletter</a>.</p>"}}]}}}}</script></body></html>
