<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 266" width="360" height="266" role="img"><title>Every price includes delivery</title><desc>Three shops. Shop B has the higher item price but free delivery, so it is the cheapest delivered and listed first. Shop A has a lower item price but costs more once delivery is added. Shop C has no known delivery charge, so its price says plus delivery, it is listed after and never counts as the cheapest.</desc><style>@font-face{font-family:'RR DM Sans';src:url(data:font/woff2;base64,) format('woff2');font-weight:500 800}text{font-family:'RR DM Sans','DM Sans',system-ui,sans-serif}</style><rect width="360" height="266" rx="16" fill="#F6F6F8"/><rect x="20" y="22" width="12" height="12" rx="3" fill="#5B6577"/><text x="38" y="32" font-size="12" font-weight="700" fill="#1F2430" text-anchor="start">Item price</text><rect x="120" y="22" width="12" height="12" rx="3" fill="#FF8A5C"/><text x="138" y="32" font-size="12" font-weight="700" fill="#1F2430" text-anchor="start">Delivery</text><text x="20" y="68" font-size="13" font-weight="800" fill="#1F2430" text-anchor="start">Shop B</text><path d="M234 70 V102" stroke="#107A32" stroke-width="1.8" stroke-dasharray="4 3"/><rect x="20" y="76" width="214" height="20" rx="6" fill="#5B6577"/><text x="244" y="91" font-size="12" font-weight="800" fill="#107A32" text-anchor="start">Free</text><path d="M21.5 108 L24.65 111.15 L30.95 104.4" fill="none" stroke="#107A32" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="36" y="112" font-size="12" font-weight="800" fill="#107A32" text-anchor="start">Cheapest delivered, listed first</text><text x="20" y="132" font-size="13" font-weight="800" fill="#1F2430" text-anchor="start">Shop A</text><path d="M234 134 V166" stroke="#107A32" stroke-width="1.8" stroke-dasharray="4 3"/><rect x="20" y="140" width="180" height="20" rx="6" fill="#5B6577"/><rect x="202" y="140" width="62" height="20" rx="6" fill="#FF8A5C"/><text x="20" y="176" font-size="12" font-weight="600" fill="#545B68" text-anchor="start">Lower item price, but dearer delivered</text><text x="20" y="196" font-size="13" font-weight="800" fill="#1F2430" text-anchor="start">Shop C</text><path d="M234 198 V230" stroke="#107A32" stroke-width="1.8" stroke-dasharray="4 3"/><rect x="20" y="204" width="168" height="20" rx="6" fill="#AEB5C0"/><rect x="190" y="205" width="58" height="18" rx="6" fill="none" stroke="#545B68" stroke-width="1.6" stroke-dasharray="4 3"/><text x="219" y="219" font-size="14" font-weight="800" fill="#545B68" text-anchor="middle">?</text><text x="20" y="240" font-size="12" font-weight="600" fill="#545B68" text-anchor="start">+ delivery: listed after, never the cheapest</text></svg>