<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 306" width="360" height="306" role="img"><title>Only stock you can buy</title><desc>Raffles and draws, members only stock, collection only stock, single cards, graded cards and used items are left out. Sealed products that are in stock or open for pre-order are shown.</desc><style>@font-face{font-family:'RR DM Sans';src:url(data:font/woff2;base64,) format('woff2');font-weight:500 800}text{font-family:'RR DM Sans','DM Sans',system-ui,sans-serif}</style><rect width="360" height="306" rx="16" fill="#F6F6F8"/><path d="M23 24 L31 32 M31 24 L23 32" stroke="#B42318" stroke-width="2.4" stroke-linecap="round"/><text x="38" y="33" font-size="13" font-weight="800" fill="#B42318" text-anchor="start">Left out</text><rect x="20" y="46" width="156" height="30" rx="10" fill="#ECEEF2"/><path d="M31.8 57.8 L38.2 64.2 M38.2 57.8 L31.8 64.2" stroke="#B42318" stroke-width="2.2" stroke-linecap="round"/><text x="48" y="66" font-size="12" font-weight="600" fill="#545B68" text-anchor="start" text-decoration="line-through">Raffle or draw</text><rect x="184" y="46" width="156" height="30" rx="10" fill="#ECEEF2"/><path d="M195.8 57.8 L202.2 64.2 M202.2 57.8 L195.8 64.2" stroke="#B42318" stroke-width="2.2" stroke-linecap="round"/><text x="212" y="66" font-size="12" font-weight="600" fill="#545B68" text-anchor="start" text-decoration="line-through">Members or VIPs</text><rect x="20" y="84" width="156" height="30" rx="10" fill="#ECEEF2"/><path d="M31.8 95.8 L38.2 102.2 M38.2 95.8 L31.8 102.2" stroke="#B42318" stroke-width="2.2" stroke-linecap="round"/><text x="48" y="104" font-size="12" font-weight="600" fill="#545B68" text-anchor="start" text-decoration="line-through">Collection only</text><rect x="184" y="84" width="156" height="30" rx="10" fill="#ECEEF2"/><path d="M195.8 95.8 L202.2 102.2 M202.2 95.8 L195.8 102.2" stroke="#B42318" stroke-width="2.2" stroke-linecap="round"/><text x="212" y="104" font-size="12" font-weight="600" fill="#545B68" text-anchor="start" text-decoration="line-through">Single cards</text><rect x="20" y="122" width="156" height="30" rx="10" fill="#ECEEF2"/><path d="M31.8 133.8 L38.2 140.2 M38.2 133.8 L31.8 140.2" stroke="#B42318" stroke-width="2.2" stroke-linecap="round"/><text x="48" y="142" font-size="12" font-weight="600" fill="#545B68" text-anchor="start" text-decoration="line-through">Graded cards</text><rect x="184" y="122" width="156" height="30" rx="10" fill="#ECEEF2"/><path d="M195.8 133.8 L202.2 140.2 M202.2 133.8 L195.8 140.2" stroke="#B42318" stroke-width="2.2" stroke-linecap="round"/><text x="212" y="142" font-size="12" font-weight="600" fill="#545B68" text-anchor="start" text-decoration="line-through">Used items</text><path d="M146 168 H214 L192 186 V198 L168 206 V186 Z" fill="#FF5A1F"/><path d="M30 177 H132 M228 177 H330" stroke="#D5D8DE" stroke-width="2" stroke-dasharray="5 5"/><path d="M22 222 L25.5 225.5 L32.5 218" fill="none" stroke="#107A32" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="38" y="227" font-size="13" font-weight="800" fill="#107A32" text-anchor="start">Shown</text><rect x="20" y="238" width="320" height="50" rx="12" fill="#FFFFFF"/><rect x="34" y="246.8" width="28" height="32.199999999999996" rx="3" fill="#3A6FD6"/><rect x="34" y="246.8" width="28" height="6.4399999999999995" rx="3" fill="#FFD23F"/><circle cx="48.0" cy="264.51" r="6.16" fill="#FFD23F"/><path d="M54.16 246.8 V279" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="1.68"/><text x="74" y="259" font-size="13" font-weight="800" fill="#1F2430" text-anchor="start">Sealed product</text><text x="74" y="277" font-size="12" font-weight="600" fill="#545B68" text-anchor="start">in stock or open for pre-order</text><rect x="268" y="250" width="62" height="26" rx="13.0" fill="#E6F4EA"/><text x="277" y="267.32" font-size="12" font-weight="700" fill="#107A32" text-anchor="start">In stock</text></svg>