{% extends "web/email/base.html" %}
{% block body %}
<h1 style="margin:0 0 12px;font-size:22px;line-height:1.25;color:#1f2430;">We replied to your message</h1>
<p style="margin:0 0 16px;padding:14px 16px;background:#f6f6f8;border-radius:12px;white-space:pre-wrap;">{{ reply }}</p>
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 16px;"><tr>
  <td style="border-radius:12px;background:#e5470e;"><a href="{{ thread_url }}" style="display:inline-block;padding:14px 24px;font-size:16px;font-weight:bold;color:#ffffff;text-decoration:none;">Open the conversation</a></td>
</tr></table>
<p style="margin:0;color:#545b68;">Reply on that page, not to this email. Nobody reads replies to this address.</p>
{% endblock %}
