{# Every product type's outline once a page (ripraptor.picture_outlines), for site.js to show in place of a shop's picture that will not load at all: the outline a product with no picture shows, never a broken picture. #}<template data-outlines>{% for kind in kinds %}<span data-outline="{{ kind }}">{% include "web/includes/placeholder.svg" with type=kind %}</span>{% endfor %}</template>
