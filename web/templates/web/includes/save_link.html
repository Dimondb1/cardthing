{% load sitecopy %}<a class="button button--quiet button--save{% if small %} button--small{% endif %}" href="{% url 'web:watchlist' %}?p={{ product.slug }}" data-watch="{{ product.slug }}" data-watch-id="{{ product.pk }}" data-watch-name="{{ product.name }}" data-watch-price="{{ price|default:'' }}" data-save-label="{% copy 'watchlist.save' %}" data-saved-label="{% copy 'watchlist.saved' %}" data-remove-label="{% copy 'watchlist.remove' %}"><svg class="icon-save" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M4 2.5h8v11l-4-3-4 3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span data-watch-label>{% copy 'watchlist.save' %}</span><span class="visually-hidden"> {{ product.name }}</span></a>
