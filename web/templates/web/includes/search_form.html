{% load sitecopy %}{% if placeholder_key %}{% copy placeholder_key as search_hint %}{% else %}{% copy "site.search.placeholder" as search_hint %}{% endif %}
<form class="search search--{{ variant }}" action="{% url 'web:search' %}" method="get" role="search"{% if live %} data-live-search="{% url 'web:search_api' %}" data-checking="{% copy 'home.search.checking' %}" data-none="{% copy 'browse.no_results.title' query='{query}' %}" data-all="{% copy 'home.search.all_results' query='{query}' %}" data-recent="{% copy 'site.search.recent' %}"{% endif %}>
  <label class="visually-hidden" for="{{ field_id }}">{{ search_hint }}</label>
  <span class="search__icon icon icon--search" aria-hidden="true"></span>
  <input id="{{ field_id }}" name="q" type="search" value="{{ query|default:'' }}" placeholder="{{ search_hint }}" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" maxlength="100"{% if live %} role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="{{ field_id }}-results"{% endif %}>
  <button class="search__button" type="submit">{% copy button_key %}</button>
</form>{% if live %}
<div class="live" hidden data-live-panel="{{ field_id }}"><p class="live__status" role="status" aria-live="polite"></p><ul class="live__results" role="listbox" id="{{ field_id }}-results"></ul></div>{% endif %}
