{# Light or dark (tokens.css, Dark mode): the page follows the device, and a choice made in the footer (site.js, kept in this browser as ripraptor.theme) is put on <html> here, before the first paint, so a page never flashes the other look. The browser's own bars take the page's colour. #}<meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14161c" media="(prefers-color-scheme: dark)">
  <script nonce="{{ csp_nonce }}">(function () { try { var t = localStorage.getItem("ripraptor.theme"); if (t === "dark" || t === "light") { var d = document; d.documentElement.setAttribute("data-theme", t); d.querySelector('meta[name="color-scheme"]').setAttribute("content", t); d.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.setAttribute("content", t === "dark" ? "#14161c" : "#ffffff"); }); } } catch (e) { /* no storage: the device decides */ } })();</script>
